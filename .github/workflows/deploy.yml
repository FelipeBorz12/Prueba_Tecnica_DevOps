name: CI/CD Pipeline - PayFast API Despliegue

on:
  push:
    branches:
      - main # Se activa al hacer push o merge a la rama principal

env:
  DOCKER_IMAGE_NAME: felipeborz12/payfast-api
  APP_DIR: /home/ubuntu/payfast-app

jobs:
  # =========================================================================
  # 1. TRABAJO DE PRUEBAS Y LINTER (CI)
  # =========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Instalar Dependencias
        run: |
          cd app
          npm install

      - name: Ejecutar Linter (Simulado)
        run: echo "Ejecutando analisis estatico de codigo... Linter Exitoso!"

      - name: Ejecutar Pruebas Unitarias (Simulado)
        run: echo "Ejecutando pruebas unitarias... 100% Exitoso!"

  # =========================================================================
  # 2. COMPILAR Y SUBIR IMAGEN DOCKER (CI)
  # =========================================================================
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test # Requiere que el paso de pruebas pase primero
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar QEMU (Soporte Multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar Sesión en Docker Hub
        if: "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}

  # =========================================================================
  # 3. DESPLIEGUE EN PRODUCCIÓN VÍA SSH (CD)
  # =========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    # Solo ejecuta el despliegue si las llaves del servidor están configuradas
    if: "${{ secrets.SERVER_HOST_IP != '' && secrets.SERVER_SSH_KEY != '' }}"
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Copiar Archivos al Servidor EC2 vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,monitoring/*"
          target: ${{ env.APP_DIR }}

      - name: Desplegar en el Servidor vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}
            # Iniciar sesión en Docker Hub en el servidor remoto si es necesario
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            # Descargar la última versión de la imagen
            docker compose pull
            # Recrear los contenedores en segundo plano sin downtime prolongado
            docker compose up -d --remove-orphans
            # Limpiar imágenes viejas sin uso para ahorrar espacio en disco
            docker image prune -f
