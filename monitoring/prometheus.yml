global:
  scrape_interval: 5s # Intervalo de tiempo para recolectar métricas (bajo para desarrollo)
  evaluation_interval: 5s

scrape_configs:
  # 1. Monitorearse a sí mismo (Prometheus)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Monitorear el Servidor/Host (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Monitorear la API (si expusiera métricas en /metrics)
  - job_name: 'payfast-api'
    metrics_path: '/health' # Usamos el healthcheck como simulación de endpoint de métricas
    static_configs:
      - targets: ['api:3000']
